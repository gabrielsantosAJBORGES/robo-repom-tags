name: Consulta Diaria Repom

on:
  schedule:
    # Executa a cada 2 horas no minuto 23 (foge do pico do minuto zero do GitHub)
    - cron: '23 */2 * * *'
  workflow_dispatch:

jobs:
  executar-consulta:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Executar o Robo Repom
        env:
          REPOM_USER: ${{ secrets.REPOM_USER }}
          REPOM_PASS: ${{ secrets.REPOM_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          REPOM_SESSION_COOKIE: ${{ secrets.REPOM_SESSION_COOKIE }}
        run: node consultar_tags_repom.js

      - name: Salvar planilha/CSV gerado
        uses: actions/upload-artifact@v4
        with:
          name: resultado-consulta-tags
          path: resultado_consulta_tags.csv
